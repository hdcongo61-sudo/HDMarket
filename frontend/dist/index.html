<!doctype html>

  <head>

    <meta name="theme-color" content="#FF6A00" />
    <meta name="description" content="HDMarket - Marketplace et boutiques vérifiées" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="HDMarket" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/icon-192.svg" />
    <script>
      // Swaps the favicon/apple-touch-icon to the admin-uploaded branding
      // (cached by src/App.jsx after its first fetch of /settings/app-logo)
      // before the app's JS bundle loads. Without this, every load briefly
      // shows the generic placeholder icon while React boots — on a slow
      // connection that "briefly" can be several seconds.
      (function () {
        try {
          var cached = JSON.parse(localStorage.getItem('hdmarket:brand-icons') || 'null');
          var faviconHref = cached && (cached.favicon || cached.icon);
          var appleHref = cached && (cached.icon || cached.favicon);
          if (faviconHref) {
            var iconLink = document.querySelector('link[rel="icon"]');
            if (iconLink) {
              iconLink.setAttribute('type', 'image/png');
              iconLink.setAttribute('href', faviconHref);
            }
          }
          if (appleHref) {
            var appleLink = document.querySelector('link[rel="apple-touch-icon"]');
            if (appleLink) appleLink.setAttribute('href', appleHref);
          }
        } catch (e) {
          /* ignore — static fallback icons stay in place */
        }
      })();
    </script>
    <!-- Served dynamically by the backend (reflects admin-edited app name/
         description live, including on first load and for non-JS crawlers)
         instead of the static /manifest.webmanifest file. -->
    <link rel="manifest" href="https://hdmarket-backend.onrender.com/api/settings/manifest.webmanifest" />

    <script type="module" crossorigin src="/assets/index-DaXsXzR2.js"></script>

    <link rel="stylesheet" crossorigin href="/assets/index-DnPvHw3i.css">
  </head>
  <body>
    <div id="root">
      <style>
        html,
        body {
          margin: 0;
          min-height: 100%;
          background: #fff8f1;
        }

        .hd-boot-shell {
          min-height: 100vh;
          min-height: 100dvh;
          display: grid;
          place-items: center;
          padding: 24px;
          background:
            radial-gradient(circle at 50% 36%, rgba(255, 106, 0, 0.12), transparent 30%),
            linear-gradient(180deg, #fffaf4 0%, #fff8f1 54%, #f7f3ee 100%);
          color: #231f1b;
          font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        .hd-boot-card {
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: 14px;
        }

        .hd-boot-logo {
          width: 72px;
          height: 72px;
          border-radius: 24px;
          display: grid;
          place-items: center;
          background: #ffffff;
          box-shadow: 0 18px 45px rgba(255, 106, 0, 0.18);
          border: 1px solid rgba(255, 106, 0, 0.16);
          overflow: hidden;
        }

        .hd-boot-logo img {
          width: 44px;
          height: 44px;
          -o-object-fit: contain;
             object-fit: contain;
        }

        .hd-boot-title {
          margin: 0;
          font-size: 12px;
          font-weight: 800;
          letter-spacing: 0.24em;
          text-transform: uppercase;
          color: rgba(35, 31, 27, 0.56);
        }

        .hd-boot-loader {
          width: 132px;
          height: 4px;
          border-radius: 999px;
          overflow: hidden;
          background: rgba(255, 106, 0, 0.13);
        }

        .hd-boot-loader::before {
          content: "";
          display: block;
          width: 45%;
          height: 100%;
          border-radius: inherit;
          background: #ff6a00;
          animation: hd-boot-progress 1s ease-in-out infinite;
        }

        @keyframes hd-boot-progress {
          0% {
            transform: translateX(-100%);
          }
          100% {
            transform: translateX(235%);
          }
        }
      </style>
      <div class="hd-boot-shell" role="status" aria-live="polite" aria-busy="true">
        <div class="hd-boot-card">
          <div class="hd-boot-logo">
            <img src="/favicon.svg" alt="HDMarket" />
            <script>
              // Same idea as the favicon swap above, for the boot-screen logo:
              // uses the brand logo cached by src/hooks/useAppBrandLogo.js from
              // a previous visit so returning users see the real logo
              // immediately instead of the generic placeholder while the app
              // takes its time to load.
              (function () {
                try {
                  var cached = JSON.parse(localStorage.getItem('hdmarket:brand-logos') || 'null');
                  if (!cached) return;
                  var isMobile = window.innerWidth < 768;
                  var src = isMobile ? cached.mobile || cached.desktop : cached.desktop || cached.mobile;
                  var img = document.currentScript.previousElementSibling;
                  if (src && img && img.tagName === 'IMG') img.src = src;
                } catch (e) {
                  /* ignore — static placeholder stays in place */
                }
              })();
            </script>
          </div>
          <p class="hd-boot-title">HDMarket</p>
          <div class="hd-boot-loader" aria-hidden="true"></div>
        </div>
      </div>
    </div>
    <noscript>HDMarket nécessite JavaScript pour fonctionner.</noscript>
  </body>
</html>
